name: aegis

services:
  aegis:
    image: ${AEGIS_IMAGE:-aegis:latest}
    build:
      context: .
      dockerfile: Dockerfile.app
      target: production
      args:
        VERSION: ${AEGIS_VERSION:-dev}
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - "${AEGIS_PORT:-8080}:8080"
    environment:
      AEGIS_HOST: 0.0.0.0
      PORT: 8080
      AEGIS_DATA_DIR: /var/lib/aegis
      AEGIS_CONTROL_URL: ${AEGIS_CONTROL_URL:-http://localhost:8080}
      AEGIS_LOG_LEVEL: ${AEGIS_LOG_LEVEL:-info}
      AEGIS_PASSWORD: ${AEGIS_PASSWORD:?请在环境变量或 .env 中设置 AEGIS_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - aegis-data:/var/lib/aegis
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

volumes:
  aegis-data:
