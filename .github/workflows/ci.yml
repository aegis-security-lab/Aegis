name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: npm ci
      - run: go test $(go list ./... | grep -v '/node_modules/')
      - run: go vet $(go list ./... | grep -v '/node_modules/')
      - run: npm run typecheck
      - run: npm run lint -- --max-warnings=0
      - run: npm run build
